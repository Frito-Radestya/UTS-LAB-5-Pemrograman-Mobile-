name: kage
description: "KAGE — The Quiz Sanctuary"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  crypto: ^3.0.8
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/data/

  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-SemiBold.ttf
          weight: 600
